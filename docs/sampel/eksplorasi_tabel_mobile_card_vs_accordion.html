<!DOCTYPE html>
<html lang="id" class="h-full bg-slate-900">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Eksplorasi Visual Tabel Mobile</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <!-- Inter Font -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap">
  
  <style>
    body {
      font-family: 'Inter', sans-serif;
    }
    /* Hide scrollbar for clean UI while allowing swipe */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    .sticky-col {
      position: sticky;
      left: 0;
      z-index: 10;
    }
  </style>
</head>
<body class="h-full flex justify-center items-start sm:py-6 bg-slate-900 text-slate-100 antialiased selection:bg-indigo-500 selection:text-white">

  <!-- Mobile Container Wrapper -->
  <div class="w-full max-w-md h-full sm:h-[880px] sm:max-h-[92vh] sm:rounded-[36px] bg-slate-800 border-0 sm:border-8 sm:border-slate-700 shadow-2xl flex flex-col overflow-hidden relative">

    <!-- Top Mobile Notch / Bar Simulation -->
    <div class="hidden sm:flex justify-between items-center px-6 pt-3 pb-1 bg-slate-950 text-slate-400 text-xs font-mono">
      <span>09:41</span>
      <div class="w-16 h-3 bg-slate-800 rounded-full"></div>
      <div class="flex items-center gap-1.5">
        <i data-lucide="wifi" class="w-3 h-3"></i>
        <i data-lucide="battery" class="w-3.5 h-3.5"></i>
      </div>
    </div>

    <!-- App Header -->
    <header class="bg-gradient-to-r from-indigo-900 via-indigo-800 to-slate-900 px-4 py-3.5 border-b border-slate-700/60 flex justify-between items-center shrink-0">
      <div class="flex items-center gap-2.5">
        <div class="w-9 h-9 rounded-xl bg-indigo-500/20 border border-indigo-400/30 flex items-center justify-center text-indigo-400">
          <i data-lucide="layout-list" class="w-5 h-5"></i>
        </div>
        <div>
          <h1 class="text-sm font-bold text-white tracking-wide">Data Kehadiran</h1>
          <p class="text-[11px] text-indigo-200/70">Semester Genap 2026</p>
        </div>
      </div>
      
      <div class="flex items-center gap-2">
        <button onclick="resetData()" title="Reset Data" class="p-2 rounded-lg bg-slate-800/80 hover:bg-slate-700 text-slate-300 transition-colors">
          <i data-lucide="rotate-ccw" class="w-4 h-4"></i>
        </button>
      </div>
    </header>

    <!-- Statistics Overview KPI Pills -->
    <section class="bg-slate-950/60 px-4 py-2.5 border-b border-slate-800 flex gap-2 overflow-x-auto no-scrollbar shrink-0">
      <div class="flex-none bg-slate-800/80 border border-slate-700/60 px-3 py-1.5 rounded-lg flex items-center gap-2">
        <div class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></div>
        <div>
          <div class="text-[10px] text-slate-400 font-medium uppercase">Total Siswa</div>
          <div id="statTotal" class="text-xs font-bold text-slate-100">0</div>
        </div>
      </div>

      <div class="flex-none bg-slate-800/80 border border-slate-700/60 px-3 py-1.5 rounded-lg flex items-center gap-2">
        <i data-lucide="check-circle-2" class="w-3.5 h-3.5 text-emerald-400"></i>
        <div>
          <div class="text-[10px] text-slate-400 font-medium uppercase">Rata-rata Hadir</div>
          <div id="statAvg" class="text-xs font-bold text-emerald-400">0%</div>
        </div>
      </div>

      <div class="flex-none bg-slate-800/80 border border-slate-700/60 px-3 py-1.5 rounded-lg flex items-center gap-2">
        <i data-lucide="alert-triangle" class="w-3.5 h-3.5 text-rose-400"></i>
        <div>
          <div class="text-[10px] text-slate-400 font-medium uppercase">Total Alpa</div>
          <div id="statAlpa" class="text-xs font-bold text-rose-400">0</div>
        </div>
      </div>
    </section>

    <!-- Control Toolbar (Search, Filter, View Mode Switcher) -->
    <div class="p-3 bg-slate-800/90 border-b border-slate-700/80 space-y-2.5 shrink-0">
      
      <!-- Search and Filter Row -->
      <div class="flex gap-2">
        <!-- Search Input -->
        <div class="relative flex-1">
          <i data-lucide="search" class="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
          <input 
            type="text" 
            id="searchInput" 
            placeholder="Cari nama siswa..." 
            class="w-full pl-9 pr-3 py-1.5 text-xs bg-slate-900/80 border border-slate-700 rounded-lg text-slate-200 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-500/50 transition-all"
            oninput="handleFilter()"
          >
        </div>

        <!-- Class Filter Dropdown -->
        <select 
          id="classFilter" 
          onchange="handleFilter()"
          class="bg-slate-900/80 border border-slate-700 text-slate-300 text-xs rounded-lg px-2 py-1.5 focus:outline-none focus:ring-2 focus:ring-indigo-500/50">
          <option value="ALL">Semua Kelas</option>
          <option value="9A">Kelas 9A</option>
          <option value="9B">Kelas 9B</option>
          <option value="9C">Kelas 9C</option>
        </select>
      </div>

      <!-- View Switcher Tabs -->
      <div class="grid grid-cols-3 gap-1 bg-slate-900/90 p-1 rounded-xl border border-slate-700/50 text-[11px] font-medium">
        <button 
          id="btnCard" 
          onclick="switchView('card')" 
          class="py-1.5 rounded-lg bg-indigo-600 text-white font-semibold shadow-sm flex items-center justify-center gap-1 transition-all">
          <i data-lucide="layout-grid" class="w-3.5 h-3.5"></i>
          1. Card
        </button>
        <button 
          id="btnAccordion" 
          onclick="switchView('accordion')" 
          class="py-1.5 rounded-lg text-slate-400 hover:text-slate-200 flex items-center justify-center gap-1 transition-all">
          <i data-lucide="rows-3" class="w-3.5 h-3.5"></i>
          2. Accordion
        </button>
        <button 
          id="btnMatrix" 
          onclick="switchView('matrix')" 
          class="py-1.5 rounded-lg text-slate-400 hover:text-slate-200 flex items-center justify-center gap-1 transition-all">
          <i data-lucide="table" class="w-3.5 h-3.5"></i>
          3. Matrix
        </button>
      </div>
    </div>

    <!-- Scrollable Content View Area -->
    <main id="contentContainer" class="flex-1 overflow-y-auto p-3 space-y-3 relative">
      <!-- Views will be injected here dynamically by JavaScript -->
    </main>

    <!-- Student Detail & Edit Modal -->
    <div id="detailModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 hidden flex items-end sm:items-center justify-center p-0 sm:p-4">
      <div class="bg-slate-800 border border-slate-700 w-full max-w-md rounded-t-2xl sm:rounded-2xl overflow-hidden shadow-2xl animate-in slide-in-from-bottom duration-200">
        
        <!-- Modal Header -->
        <div class="p-4 bg-slate-900 border-b border-slate-700 flex justify-between items-center">
          <div class="flex items-center gap-2">
            <div class="w-8 h-8 rounded-full bg-indigo-500/20 text-indigo-400 flex items-center justify-center font-bold text-xs" id="modalAvatar">
              FA
            </div>
            <div>
              <h3 id="modalName" class="text-sm font-bold text-white">Ahmad Fauzi</h3>
              <p id="modalClass" class="text-xs text-slate-400">Kelas 9A</p>
            </div>
          </div>
          <button onclick="closeModal()" class="p-1 rounded-lg text-slate-400 hover:bg-slate-800 hover:text-white">
            <i data-lucide="x" class="w-5 h-5"></i>
          </button>
        </div>

        <!-- Modal Body -->
        <div class="p-4 space-y-4">
          <div class="grid grid-cols-2 gap-3">
            <div class="bg-slate-900/60 p-3 rounded-xl border border-slate-700/50">
              <span class="text-[10px] text-slate-400 uppercase block font-medium">Persentase Hadir</span>
              <span id="modalPercent" class="text-lg font-bold text-emerald-400">95%</span>
            </div>
            <div class="bg-slate-900/60 p-3 rounded-xl border border-slate-700/50">
              <span class="text-[10px] text-slate-400 uppercase block font-medium">Total Hari Efektif</span>
              <span id="modalTotalDays" class="text-lg font-bold text-indigo-400">20 Hari</span>
            </div>
          </div>

          <!-- Rincian Perilaku Absensi Breakdown -->
          <div>
            <h4 class="text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">Rincian Kehadiran & Perilaku</h4>
            <div class="space-y-2">
              <div class="flex justify-between items-center p-2.5 rounded-lg bg-emerald-500/10 border border-emerald-500/20">
                <span class="text-xs text-emerald-300 font-medium flex items-center gap-2">
                  <i data-lucide="check" class="w-4 h-4"></i> Hadir
                </span>
                <span id="modalHadir" class="text-xs font-bold text-emerald-400">19</span>
              </div>
              <div class="flex justify-between items-center p-2.5 rounded-lg bg-amber-500/10 border border-amber-500/20">
                <span class="text-xs text-amber-300 font-medium flex items-center gap-2">
                  <i data-lucide="stethoscope" class="w-4 h-4"></i> Sakit
                </span>
                <span id="modalSakit" class="text-xs font-bold text-amber-400">1</span>
              </div>
              <div class="flex justify-between items-center p-2.5 rounded-lg bg-blue-500/10 border border-blue-500/20">
                <span class="text-xs text-blue-300 font-medium flex items-center gap-2">
                  <i data-lucide="file-text" class="w-4 h-4"></i> Izin
                </span>
                <span id="modalIzin" class="text-xs font-bold text-blue-400">0</span>
              </div>
              <div class="flex justify-between items-center p-2.5 rounded-lg bg-rose-500/10 border border-rose-500/20">
                <span class="text-xs text-rose-300 font-medium flex items-center gap-2">
                  <i data-lucide="user-x" class="w-4 h-4"></i> Alpa / Tanpa Keterangan
                </span>
                <span id="modalAlpa" class="text-xs font-bold text-rose-400">0</span>
              </div>
            </div>
          </div>
        </div>

        <!-- Modal Footer -->
        <div class="p-3 bg-slate-900/80 border-t border-slate-700 flex justify-end">
          <button onclick="closeModal()" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-semibold rounded-xl transition-all">
            Tutup
          </button>
        </div>
      </div>
    </div>

    <!-- Bottom Navigation Footer Bar -->
    <footer class="p-2.5 bg-slate-950 border-t border-slate-800 text-center text-[10px] text-slate-500 shrink-0">
      Format Visual: <span id="currentViewLabel" class="text-indigo-400 font-semibold">Option 1 - Card Based</span>
    </footer>

  </div>

  <script>
    // Initial Dataset
    const initialStudents = [
      { id: 1, nama: "Ahmad Fauzi", kelas: "9A", hadir: 19, sakit: 1, izin: 0, alpa: 0 },
      { id: 2, nama: "Siti Rahma", kelas: "9B", hadir: 16, sakit: 2, izin: 1, alpa: 1 },
      { id: 3, nama: "Budi Santoso", kelas: "9A", hadir: 20, sakit: 0, izin: 0, alpa: 0 },
      { id: 4, nama: "Dewi Lestari", kelas: "9C", hadir: 18, sakit: 1, izin: 1, alpa: 0 },
      { id: 5, nama: "Eko Prasetyo", kelas: "9B", hadir: 14, sakit: 0, izin: 2, alpa: 4 },
      { id: 6, nama: "Farah Diba", kelas: "9A", hadir: 19, sakit: 0, izin: 1, alpa: 0 },
      { id: 7, nama: "Gilang Ramadhan", kelas: "9C", hadir: 15, sakit: 3, izin: 0, alpa: 2 }
    ];

    let students = [...initialStudents];
    let currentView = 'card';
    let expandedAccordions = new Set();

    // Calculate percentage helper
    function getPercentage(student) {
      const total = student.hadir + student.sakit + student.izin + student.alpa;
      if (total === 0) return 0;
      return Math.round((student.hadir / total) * 100);
    }

    // Update KPI Header Stats
    function updateKPIs(filteredList) {
      document.getElementById('statTotal').innerText = filteredList.length;
      
      if (filteredList.length === 0) {
        document.getElementById('statAvg').innerText = '0%';
        document.getElementById('statAlpa').innerText = '0';
        return;
      }

      const totalAvg = filteredList.reduce((acc, curr) => acc + getPercentage(curr), 0) / filteredList.length;
      const totalAlpa = filteredList.reduce((acc, curr) => acc + curr.alpa, 0);

      document.getElementById('statAvg').innerText = `${Math.round(totalAvg)}%`;
      document.getElementById('statAlpa').innerText = totalAlpa;
    }

    // Render View 1: Card-Based Pattern (Option 1)
    function renderCardView(data) {
      if (data.length === 0) return renderEmptyState();

      return data.map(s => {
        const pct = getPercentage(s);
        const pctColor = pct >= 90 ? 'text-emerald-400 bg-emerald-500/10' : (pct >= 75 ? 'text-amber-400 bg-amber-500/10' : 'text-rose-400 bg-rose-500/10');

        return `
          <article class="bg-slate-800/90 border border-slate-700/80 rounded-2xl p-3.5 space-y-3 shadow-md hover:border-slate-600 transition-all">
            <div class="flex justify-between items-start">
              <div>
                <h3 class="font-bold text-slate-100 text-sm flex items-center gap-1.5">
                  ${s.nama}
                </h3>
                <div class="flex items-center gap-2 mt-1">
                  <span class="text-[11px] font-semibold text-slate-400 bg-slate-900 px-2 py-0.5 rounded-md border border-slate-700/60">
                    ${s.kelas}
                  </span>
                  <span class="text-xs font-bold px-2 py-0.5 rounded-full ${pctColor}">
                    ${pct}% Hadir
                  </span>
                </div>
              </div>
              <button onclick="openModal(${s.id})" class="p-1.5 rounded-lg text-slate-400 hover:text-indigo-400 hover:bg-slate-700/60 transition-colors">
                <i data-lucide="eye" class="w-4 h-4"></i>
              </button>
            </div>

            <div class="pt-2 border-t border-slate-700/50">
              <div class="text-[10px] font-semibold text-slate-400 uppercase tracking-wider mb-1.5">Status Absensi / Perilaku</div>
              <div class="grid grid-cols-4 gap-1.5 text-center text-xs">
                <div class="bg-slate-900/60 border border-emerald-500/20 p-1.5 rounded-xl">
                  <span class="block text-slate-400 text-[10px]">Hadir</span>
                  <span class="font-bold text-emerald-400">${s.hadir}</span>
                </div>
                <div class="bg-slate-900/60 border border-amber-500/20 p-1.5 rounded-xl">
                  <span class="block text-slate-400 text-[10px]">Sakit</span>
                  <span class="font-bold text-amber-400">${s.sakit}</span>
                </div>
                <div class="bg-slate-900/60 border border-blue-500/20 p-1.5 rounded-xl">
                  <span class="block text-slate-400 text-[10px]">Izin</span>
                  <span class="font-bold text-blue-400">${s.izin}</span>
                </div>
                <div class="bg-slate-900/60 border border-rose-500/20 p-1.5 rounded-xl">
                  <span class="block text-slate-400 text-[10px]">Alpa</span>
                  <span class="font-bold text-rose-400">${s.alpa}</span>
                </div>
              </div>
            </div>
          </article>
        `;
      }).join('');
    }

    // Render View 2: Expandable Accordion Pattern (Option 2)
    function renderAccordionView(data) {
      if (data.length === 0) return renderEmptyState();

      return `
        <div class="space-y-2">
          <div class="grid grid-cols-12 px-3 py-1.5 text-[10px] font-bold text-slate-400 uppercase tracking-wider">
            <div class="col-span-5">Nama Siswa</div>
            <div class="col-span-3 text-center">Kelas</div>
            <div class="col-span-3 text-center">Hadir %</div>
            <div class="col-span-1"></div>
          </div>
          ${data.map(s => {
            const pct = getPercentage(s);
            const isExpanded = expandedAccordions.has(s.id);
            const pctColor = pct >= 90 ? 'text-emerald-400 bg-emerald-500/10' : (pct >= 75 ? 'text-amber-400 bg-amber-500/10' : 'text-rose-400 bg-rose-500/10');

            return `
              <div class="bg-slate-800/90 border border-slate-700/80 rounded-xl overflow-hidden transition-all">
                <button 
                  onclick="toggleAccordion(${s.id})" 
                  class="w-full grid grid-cols-12 items-center p-3 text-left hover:bg-slate-700/40 transition-colors">
                  <div class="col-span-5 pr-2">
                    <p class="text-xs font-semibold text-slate-200 truncate">${s.nama}</p>
                  </div>
                  <div class="col-span-3 text-center">
                    <span class="text-[11px] font-medium bg-slate-900 text-slate-400 px-2 py-0.5 rounded border border-slate-700/50">
                      ${s.kelas}
                    </span>
                  </div>
                  <div class="col-span-3 text-center">
                    <span class="text-xs font-bold px-2 py-0.5 rounded-full ${pctColor}">
                      ${pct}%
                    </span>
                  </div>
                  <div class="col-span-1 text-right flex justify-end">
                    <i data-lucide="chevron-down" class="w-4 h-4 text-slate-400 transition-transform duration-200 ${isExpanded ? 'rotate-180 text-indigo-400' : ''}"></i>
                  </div>
                </button>

                ${isExpanded ? `
                  <div class="p-3 bg-slate-900/80 border-t border-slate-700/60 text-xs space-y-2.5 animate-in fade-in duration-150">
                    <div class="flex justify-between items-center">
                      <span class="text-[11px] font-semibold text-slate-400 uppercase">Detail Sub-Perilaku</span>
                      <button onclick="openModal(${s.id})" class="text-[11px] text-indigo-400 hover:underline flex items-center gap-1">
                        Modal Detail <i data-lucide="external-link" class="w-3 h-3"></i>
                      </button>
                    </div>
                    <div class="grid grid-cols-2 gap-2 text-slate-300">
                      <div class="flex justify-between bg-slate-800 p-2 rounded-lg border border-slate-700/50">
                        <span class="text-slate-400">Hadir:</span> <strong class="text-emerald-400">${s.hadir} Hari</strong>
                      </div>
                      <div class="flex justify-between bg-slate-800 p-2 rounded-lg border border-slate-700/50">
                        <span class="text-slate-400">Sakit:</span> <strong class="text-amber-400">${s.sakit} Hari</strong>
                      </div>
                      <div class="flex justify-between bg-slate-800 p-2 rounded-lg border border-slate-700/50">
                        <span class="text-slate-400">Izin:</span> <strong class="text-blue-400">${s.izin} Hari</strong>
                      </div>
                      <div class="flex justify-between bg-slate-800 p-2 rounded-lg border border-slate-700/50">
                        <span class="text-slate-400">Alpa:</span> <strong class="text-rose-400">${s.alpa} Hari</strong>
                      </div>
                    </div>
                  </div>
                ` : ''}
              </div>
            `;
          }).join('')}
        </div>
      `;
    }

    // Render View 3: Fixed Column Scrollable Table (Option 3)
    function renderMatrixView(data) {
      if (data.length === 0) return renderEmptyState();

      return `
        <div class="border border-slate-700/80 rounded-xl overflow-hidden bg-slate-800/90 shadow-md">
          <div class="text-[10px] text-slate-400 px-3 py-1.5 bg-slate-900 border-b border-slate-700/80 flex items-center gap-1">
            <i data-lucide="arrow-left-right" class="w-3 h-3 text-indigo-400"></i>
            <span>Geser horizontal untuk melihat kolom lengkap</span>
          </div>
          <div class="overflow-x-auto no-scrollbar">
            <table class="w-full text-xs text-left text-slate-300">
              <thead class="bg-slate-900 text-[10px] text-slate-400 uppercase border-b border-slate-700/80">
                <tr>
                  <th scope="col" class="px-3 py-2 sticky-col bg-slate-900 border-r border-slate-700/80 min-w-[120px]">
                    Nama
                  </th>
                  <th scope="col" class="px-3 py-2 text-center">Kelas</th>
                  <th scope="col" class="px-3 py-2 text-center">% Hadir</th>
                  <th scope="col" class="px-3 py-2 text-center text-emerald-400">Hadir</th>
                  <th scope="col" class="px-3 py-2 text-center text-amber-400">Sakit</th>
                  <th scope="col" class="px-3 py-2 text-center text-blue-400">Izin</th>
                  <th scope="col" class="px-3 py-2 text-center text-rose-400">Alpa</th>
                </tr>
              </thead>
              <tbody class="divide-y divide-slate-700/50">
                ${data.map(s => {
                  const pct = getPercentage(s);
                  return `
                    <tr class="hover:bg-slate-700/30 transition-colors">
                      <td class="px-3 py-2.5 font-semibold text-slate-100 sticky-col bg-slate-800 border-r border-slate-700/80 truncate max-w-[130px]">
                        ${s.nama}
                      </td>
                      <td class="px-3 py-2.5 text-center text-slate-400">${s.kelas}</td>
                      <td class="px-3 py-2.5 text-center font-bold text-indigo-400">${pct}%</td>
                      <td class="px-3 py-2.5 text-center font-medium text-emerald-400 bg-emerald-500/5">${s.hadir}</td>
                      <td class="px-3 py-2.5 text-center font-medium text-amber-400 bg-amber-500/5">${s.sakit}</td>
                      <td class="px-3 py-2.5 text-center font-medium text-blue-400 bg-blue-500/5">${s.izin}</td>
                      <td class="px-3 py-2.5 text-center font-medium text-rose-400 bg-rose-500/5">${s.alpa}</td>
                    </tr>
                  `;
                }).join('')}
              </tbody>
            </table>
          </div>
        </div>
      `;
    }

    // Helper for empty data state
    function renderEmptyState() {
      return `
        <div class="text-center py-12 space-y-3 bg-slate-800/40 rounded-2xl border border-dashed border-slate-700 p-6">
          <div class="w-12 h-12 rounded-full bg-slate-800 flex items-center justify-center mx-auto text-slate-500">
            <i data-lucide="search-x" class="w-6 h-6"></i>
          </div>
          <p class="text-sm text-slate-400 font-medium">Tidak ada siswa yang cocok dengan pencarian.</p>
        </div>
      `;
    }

    // Filter logic
    function getFilteredData() {
      const search = document.getElementById('searchInput').value.toLowerCase().trim();
      const selectedClass = document.getElementById('classFilter').value;

      return students.filter(student => {
        const matchName = student.nama.toLowerCase().includes(search);
        const matchClass = selectedClass === 'ALL' || student.kelas === selectedClass;
        return matchName && matchClass;
      });
    }

    // Render Current View
    function render() {
      const filtered = getFilteredData();
      updateKPIs(filtered);

      const container = document.getElementById('contentContainer');
      
      if (currentView === 'card') {
        container.innerHTML = renderCardView(filtered);
      } else if (currentView === 'accordion') {
        container.innerHTML = renderAccordionView(filtered);
      } else if (currentView === 'matrix') {
        container.innerHTML = renderMatrixView(filtered);
      }

      lucide.createIcons();
    }

    // View switcher handler
    function switchView(view) {
      currentView = view;
      
      const btnCard = document.getElementById('btnCard');
      const btnAccordion = document.getElementById('btnAccordion');
      const btnMatrix = document.getElementById('btnMatrix');
      const label = document.getElementById('currentViewLabel');

      const activeClass = "py-1.5 rounded-lg bg-indigo-600 text-white font-semibold shadow-sm flex items-center justify-center gap-1 transition-all";
      const inactiveClass = "py-1.5 rounded-lg text-slate-400 hover:text-slate-200 flex items-center justify-center gap-1 transition-all";

      btnCard.className = view === 'card' ? activeClass : inactiveClass;
      btnAccordion.className = view === 'accordion' ? activeClass : inactiveClass;
      btnMatrix.className = view === 'matrix' ? activeClass : inactiveClass;

      if (view === 'card') label.innerText = "Opsi 1 - Card Based Pattern";
      if (view === 'accordion') label.innerText = "Opsi 2 - Expandable Accordion";
      if (view === 'matrix') label.innerText = "Opsi 3 - Scrollable Matrix Table";

      render();
    }

    // Accordion toggle handler
    function toggleAccordion(id) {
      if (expandedAccordions.has(id)) {
        expandedAccordions.delete(id);
      } else {
        expandedAccordions.add(id);
      }
      render();
    }

    // Filter input handler
    function handleFilter() {
      render();
    }

    // Modal Details Logic
    function openModal(studentId) {
      const s = students.find(item => item.id === studentId);
      if (!s) return;

      const totalDays = s.hadir + s.sakit + s.izin + s.alpa;
      const pct = getPercentage(s);

      const initials = s.nama.split(' ').map(n => n[0]).join('').substring(0, 2);
      document.getElementById('modalAvatar').innerText = initials;
      document.getElementById('modalName').innerText = s.nama;
      document.getElementById('modalClass').innerText = `Kelas ${s.kelas}`;
      document.getElementById('modalPercent').innerText = `${pct}%`;
      document.getElementById('modalTotalDays').innerText = `${totalDays} Hari`;

      document.getElementById('modalHadir').innerText = `${s.hadir} Hari`;
      document.getElementById('modalSakit').innerText = `${s.sakit} Hari`;
      document.getElementById('modalIzin').innerText = `${s.izin} Hari`;
      document.getElementById('modalAlpa').innerText = `${s.alpa} Hari`;

      document.getElementById('detailModal').classList.remove('hidden');
    }

    function closeModal() {
      document.getElementById('detailModal').classList.add('hidden');
    }

    function resetData() {
      students = [...initialStudents];
      document.getElementById('searchInput').value = '';
      document.getElementById('classFilter').value = 'ALL';
      render();
    }

    // Initial Launch
    window.onload = function() {
      render();
    };
  </script>
</body>
</html>
